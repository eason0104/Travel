<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>旅行護照 · Eason 的行程總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1826;
    --bg-soft: #16223580;
    --paper: #F4EFE3;
    --paper-shadow: #E7DFC9;
    --ink: #16202E;
    --ink-soft: #4C5A6E;
    --cream-70: #F4EFE380;
    --line: #2A3850;
    --jp: #2E6B52;
    --jp-soft: #E4EFE9;
    --kr: #B23C3C;
    --kr-soft: #F5E3E1;
    --gold: #C79A5B;
    --radius-card: 22px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, #1B2C46 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, #17233A 0%, transparent 55%);
    color: var(--paper);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  a{ color: inherit; text-decoration: none; }

  /* ---------- Header ---------- */
  header{
    max-width: 960px;
    margin: 0 auto;
    padding: 56px 24px 40px;
  }

  .eyebrow{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 22px;
  }

  .eyebrow::before{
    content: "";
    width: 26px;
    height: 1px;
    background: var(--gold);
    display: inline-block;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 6vw, 56px);
    line-height: 1.15;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  h1 em{
    font-style: italic;
    font-weight: 400;
    color: var(--gold);
  }

  .subtitle{
    font-size: 16px;
    line-height: 1.7;
    color: #B9C3D4;
    max-width: 46ch;
    margin: 0 0 34px;
  }

  .stats{
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .stat{
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #131F32;
    font-size: 13px;
    color: #A9B4C6;
  }

  .stat b{
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    color: var(--paper);
  }

  /* ---------- Trip list ---------- */
  main{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .section-label{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6B7A93;
    margin: 0 0 18px;
    padding-left: 2px;
  }

  .trip-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .ticket{
    position: relative;
    display: grid;
    grid-template-columns: 1fr 132px;
    background: var(--paper);
    border-radius: var(--radius-card);
    color: var(--ink);
    box-shadow: 0 18px 40px -18px rgba(0,0,0,0.55);
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  }

  .ticket:hover,
  .ticket:focus-visible{
    transform: translateY(-4px);
    box-shadow: 0 26px 50px -18px rgba(0,0,0,0.65);
  }

  .ticket:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .ticket-main{
    padding: 28px 26px 24px;
    position: relative;
  }

  .ticket-status{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 11px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .ticket-status.completed{ background: #E4E1D3; color: #6B6752; }
  .ticket-status.upcoming{ background: var(--jp-soft); color: var(--jp); }
  .ticket-status.live{ background: var(--kr-soft); color: var(--kr); }

  .ticket[data-country="jp"] .ticket-status.completed{ background: var(--jp-soft); color: var(--jp); }
  .ticket[data-country="kr"] .ticket-status.upcoming{ background: var(--kr-soft); color: var(--kr); }

  .ticket-country{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  .ticket-city{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 32px;
    line-height: 1.1;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .ticket-meta{
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 4px;
  }

  .meta-item{ display: flex; flex-direction: column; gap: 3px; }

  .meta-label{
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .meta-value{
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }

  /* perforated divider */
  .ticket-divider{
    position: relative;
    width: 0;
    border-left: 2px dashed #C9C1AB;
  }

  .ticket-divider::before,
  .ticket-divider::after{
    content: "";
    position: absolute;
    left: -13px;
    width: 26px;
    height: 26px;
    background: var(--bg);
    border-radius: 50%;
  }
  .ticket-divider::before{ top: -13px; }
  .ticket-divider::after{ bottom: -13px; }

  .ticket-stub{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 14px;
    text-align: center;
  }

  .stub-code{
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
  }

  .stub-cta{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }

  .stub-cta .arrow{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .25s ease, color .25s ease, transform .25s ease;
  }

  .ticket:hover .stub-cta .arrow{
    background: var(--ink);
    color: var(--paper);
    transform: translateX(2px);
  }

  .ticket[data-country="jp"] .stub-cta .arrow{ border-color: var(--jp); color: var(--jp); }
  .ticket[data-country="jp"]:hover .stub-cta .arrow{ background: var(--jp); color: var(--paper); }
  .ticket[data-country="kr"] .stub-cta .arrow{ border-color: var(--kr); color: var(--kr); }
  .ticket[data-country="kr"]:hover .stub-cta .arrow{ background: var(--kr); color: var(--paper); }

  .flag{ font-size: 15px; }

  /* ---------- empty slot for future trips ---------- */
  .ticket.placeholder{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 140px;
    background: transparent;
    border: 1.5px dashed var(--line);
    color: #5C6B84;
    font-size: 13px;
    box-shadow: none;
  }
  .ticket.placeholder:hover{ transform: none; }

  footer{
    max-width: 960px;
    margin: 56px auto 0;
    padding: 24px 24px 0;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: #5C6B84;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  @media (min-width: 640px){
    .trip-grid{ grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 480px){
    .ticket{ grid-template-columns: 1fr 96px; }
    .ticket-city{ font-size: 26px; }
    .ticket-main{ padding: 24px 18px 20px; }
    .stub-code{ display: none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Travel Log</p>
  <h1>我的<em>旅行</em>護照</h1>
  <p class="subtitle">每一趟旅程都值得被好好記錄。點選任一目的地，回到當時規劃的完整行程表。</p>
  <div class="stats" id="stats"></div>
</header>

<main>
  <p class="section-label">Destinations</p>
  <div class="trip-grid" id="trip-grid"></div>
</main>

<footer>
  <span>Crafted by Eason</span>
  <span id="last-updated"></span>
</footer>

<script>
  // ---------------------------------------------------------------
  // 行程資料：未來新增旅程，只要在這裡加一筆物件即可自動出現在總覽上
  // ---------------------------------------------------------------
  const trips = [
    {
      country: "jp",
      countryLabel: "JAPAN",
      flag: "🇯🇵",
      city: "大阪 · 名古屋",
      code: "OSA / NGO",
      start: "2026-06-27",
      end: "2026-07-05",
      href: "nagoya/"
    },
    {
      country: "kr",
      countryLabel: "SOUTH KOREA",
      flag: "🇰🇷",
      city: "釜山",
      code: "PUS",
      start: "2026-12-26",
      end: "2027-01-01",
      href: "busan/"
    }
  ];

  const fmt = (d) => {
    const date = new Date(d + "T00:00:00");
    return `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,"0")}.${String(date.getDate()).padStart(2,"0")}`;
  };

  const nightsBetween = (start, end) => {
    const s = new Date(start + "T00:00:00");
    const e = new Date(end + "T00:00:00");
    return Math.round((e - s) / (1000 * 60 * 60 * 24));
  };

  const getStatus = (start, end) => {
    const today = new Date();
    today.setHours(0,0,0,0);
    const s = new Date(start + "T00:00:00");
    const e = new Date(end + "T00:00:00");
    if (today < s) {
      const days = Math.round((s - today) / (1000*60*60*24));
      return { type: "upcoming", label: `倒數 ${days} 天` };
    }
    if (today > e) {
      return { type: "completed", label: "已完成" };
    }
    return { type: "live", label: "旅行中" };
  };

  const grid = document.getElementById("trip-grid");

  trips
    .slice()
    .sort((a, b) => new Date(a.start) - new Date(b.start))
    .forEach(trip => {
      const nights = nightsBetween(trip.start, trip.end);
      const status = getStatus(trip.start, trip.end);

      const card = document.createElement("a");
      card.href = trip.href;
      card.className = "ticket";
      card.setAttribute("data-country", trip.country);

      card.innerHTML = `
        <div class="ticket-main">
          <span class="ticket-status ${status.type}">${status.label}</span>
          <p class="ticket-country">${trip.flag} ${trip.countryLabel}</p>
          <h2 class="ticket-city">${trip.city}</h2>
          <div class="ticket-meta">
            <div class="meta-item">
              <span class="meta-label">Dates</span>
              <span class="meta-value">${fmt(trip.start)} – ${fmt(trip.end)}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Duration</span>
              <span class="meta-value">${nights + 1}天${nights}夜</span>
            </div>
          </div>
        </div>
        <div class="ticket-divider"></div>
        <div class="ticket-stub">
          <span class="stub-code">${trip.code}</span>
          <span class="stub-cta">查看行程<span class="arrow">→</span></span>
        </div>
      `;
      grid.appendChild(card);
    });

  // 補一格「下一趟旅程」佔位卡，維持版面完整並暗示可擴充
  const placeholder = document.createElement("div");
  placeholder.className = "ticket placeholder";
  placeholder.textContent = "下一趟旅程，敬請期待";
  grid.appendChild(placeholder);

  // ---------------------------------------------------------------
  // 統計數字
  // ---------------------------------------------------------------
  const countries = new Set(trips.map(t => t.country)).size;
  const totalNights = trips.reduce((sum, t) => sum + nightsBetween(t.start, t.end), 0);

  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${trips.length}</b> 趟旅程</div>
    <div class="stat"><b>${countries}</b> 個國家</div>
    <div class="stat"><b>${totalNights}</b> 個夜晚</div>
  `;

  document.getElementById("last-updated").textContent =
    "Last updated " + new Date().toISOString().slice(0,10);
</script>

</body>
</html>
